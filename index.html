<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0e">
  <title>视频</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #0b0c0e;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      place-items: center;
      padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
      background: #0b0c0e;
    }

    main {
      width: min(100%, 1120px);
    }

    .player {
      overflow: hidden;
      border-radius: 8px;
      background: #000;
      box-shadow: 0 18px 60px rgb(0 0 0 / 45%);
    }

    video {
      display: block;
      width: 100%;
      max-height: calc(100dvh - 24px);
      background: #000;
      object-fit: contain;
    }

    video:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: -2px;
    }

    .fallback {
      margin: 16px;
      color: #e8e8ea;
      font-size: 15px;
      line-height: 1.6;
      text-align: center;
    }

    .fallback a {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <main>
    <div class="player">
      <video
        controls
        playsinline
        webkit-playsinline
        preload="metadata"
        aria-label="视频"
      >
        <source src="video.mp4" type="video/mp4">
        <p class="fallback">当前浏览器无法播放，<a href="video.mp4">点此打开视频</a>。</p>
      </video>
    </div>
  </main>
</body>
</html>
